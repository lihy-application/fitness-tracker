<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>💪 小P健身打卡助手</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#4ECDC4',
                        secondary: '#45B7D1',
                        success: '#96CEB4',
                        warning: '#FFEAA7',
                        info: '#A8E6CF',
                        dark: '#2A2A2A',
                        light: '#F7FCFC'
                    },
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <style type="text/tailwindcss">
        @layer utilities {
            .content-auto {
                content-visibility: auto;
            }
            .card-shadow {
                box-shadow: 0 10px 25px -5px rgba(78, 205, 196, 0.2);
            }
            .cute-border {
                border: 2px solid #4ECDC4;
                border-radius: 16px;
            }
            .cute-shadow {
                box-shadow: 4px 4px 0px rgba(0, 0, 0, 0.05);
            }
            .cute-hover {
                transition: all 0.3s ease;
            }
            .cute-hover:hover {
                transform: translateY(-2px);
                box-shadow: 6px 6px 0px rgba(0, 0, 0, 0.08);
            }
            .calendar-day {
                aspect-ratio: 1/1;
                display: flex;
                align-items: center;
                justify-content: center;
                border-radius: 10px;
                transition: all 0.2s ease;
                cursor: pointer;
                font-weight: 500;
            }
            .calendar-day:hover {
                transform: scale(1.05);
            }
            .calendar-day.workout {
                background: linear-gradient(135deg, #4ECDC4 0%, #45B7D1 100%);
                color: white;
            }
        }
    </style>
</head>
<body class="bg-gradient-to-br from-sky-50 via-cyan-50 to-teal-50 min-h-screen text-dark">
    <header class="text-center py-8 px-4">
        <h1 class="text-[clamp(2rem,5vw,3rem)] font-bold bg-gradient-to-r from-primary to-secondary bg-clip-text text-transparent">
            💪 小P健身打卡助手
        </h1>
        <p class="text-gray-600 text-lg mt-2">清爽打卡 · 轻松记录每一次运动 ✨</p>
    </header>

    <main class="max-w-7xl mx-auto px-4 pb-16">
        <!-- 数据概览 -->
        <div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-8">
            <div class="bg-white rounded-2xl p-5 card-shadow cute-border cute-shadow cute-hover">
                <div class="flex items-center gap-3">
                    <div class="w-12 h-12 rounded-full bg-primary/20 flex items-center justify-center text-2xl">🔥</div>
                    <div>
                        <p class="text-gray-500 text-sm">连续打卡</p>
                        <p class="text-2xl font-bold text-primary" id="streak">0</p>
                        <p class="text-xs text-gray-400">天</p>
                    </div>
                </div>
            </div>
            <div class="bg-white rounded-2xl p-5 card-shadow cute-border cute-shadow cute-hover">
                <div class="flex items-center gap-3">
                    <div class="w-12 h-12 rounded-full bg-success/20 flex items-center justify-center text-2xl">⏱️</div>
                    <div>
                        <p class="text-gray-500 text-sm">本月运动</p>
                        <p class="text-2xl font-bold text-success" id="monthlyHours">0</p>
                        <p class="text-xs text-gray-400">小时</p>
                    </div>
                </div>
            </div>
            <div class="bg-white rounded-2xl p-5 card-shadow cute-border cute-shadow cute-hover">
                <div class="flex items-center gap-3">
                    <div class="w-12 h-12 rounded-full bg-warning/20 flex items-center justify-center text-2xl">🎯</div>
                    <div>
                        <p class="text-gray-500 text-sm">本周目标</p>
                        <p class="text-2xl font-bold text-warning" id="weeklyTarget">0/5</p>
                        <p class="text-xs text-gray-400">次</p>
                    </div>
                </div>
            </div>
            <div class="bg-white rounded-2xl p-5 card-shadow cute-border cute-shadow cute-hover">
                <div class="flex items-center gap-3">
                    <div class="w-12 h-12 rounded-full bg-info/20 flex items-center justify-center text-2xl">💖</div>
                    <div>
                        <p class="text-gray-500 text-sm">总打卡次数</p>
                        <p class="text-2xl font-bold text-info" id="totalWorkouts">0</p>
                        <p class="text-xs text-gray-400">次</p>
                    </div>
                </div>
            </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            <!-- 左侧打卡面板 -->
            <div class="lg:col-span-1">
                <div class="bg-white rounded-2xl p-6 card-shadow cute-border cute-shadow">
                    <h2 class="text-2xl font-bold mb-4 flex items-center gap-2">
                        <span class="text-2xl">✍️</span> 今日打卡
                    </h2>
                    <form id="workoutForm" class="space-y-4">
                        <div>
                            <label class="block text-gray-600 mb-2 font-medium">运动类型 🏋️</label>
                            <select id="workoutType" class="w-full rounded-xl border-2 border-primary/30 p-3 focus:border-primary focus:ring-2 focus:ring-primary/20 outline-none transition-all">
                                <option value="跑步">跑步 🏃</option>
                                <option value="力量训练">力量训练 🏋️</option>
                                <option value="游泳">游泳 🏊</option>
                                <option value="骑行">骑行 🚴</option>
                                <option value="瑜伽">瑜伽 🧘</option>
                                <option value="徒步">徒步 🥾</option>
                                <option value="跳绳">跳绳 🪀</option>
                                <option value="舞蹈">舞蹈 💃</option>
                                <option value="球类运动">球类运动 🏀</option>
                                <option value="其他">其他 ✨</option>
                            </select>
                        </div>
                        <div class="grid grid-cols-2 gap-3">
                            <div>
                                <label class="block text-gray-600 mb-2 font-medium">运动时长 ⏱️</label>
                                <input type="number" id="duration" min="1" placeholder="分钟" class="w-full rounded-xl border-2 border-primary/30 p-3 focus:border-primary focus:ring-2 focus:ring-primary/20 outline-none transition-all">
                            </div>
                            <div>
                                <label class="block text-gray-600 mb-2 font-medium">消耗卡路里 🔥</label>
                                <input type="number" id="calories" min="1" placeholder="大卡" class="w-full rounded-xl border-2 border-primary/30 p-3 focus:border-primary focus:ring-2 focus:ring-primary/20 outline-none transition-all">
                            </div>
                        </div>
                        <div>
                            <label class="block text-gray-600 mb-2 font-medium">运动感受 💬</label>
                            <textarea id="notes" rows="2" placeholder="今天运动感受如何~" class="w-full rounded-xl border-2 border-primary/30 p-3 focus:border-primary focus:ring-2 focus:ring-primary/20 outline-none transition-all resize-none"></textarea>
                        </div>
                        <button type="submit" class="w-full bg-gradient-to-r from-primary to-secondary text-white py-4 rounded-xl font-bold text-lg cute-shadow cute-hover transition-all">
                            <i class="fa fa-check-circle mr-2"></i> 完成打卡 ✅
                        </button>
                    </form>
                </div>
            </div>

            <!-- 右侧日历和历史记录 -->
            <div class="lg:col-span-2 space-y-6">
                <!-- 日历 -->
                <div class="bg-white rounded-2xl p-6 card-shadow cute-border cute-shadow">
                    <div class="flex items-center justify-between mb-4">
                        <h2 class="text-2xl font-bold flex items-center gap-2">
                            <span class="text-2xl">📅</span> 打卡日历
                        </h2>
                        <div class="flex items-center gap-2">
                            <button onclick="changeMonth(-1)" class="w-10 h-10 rounded-full bg-gray-100 hover:bg-gray-200 flex items-center justify-center font-bold transition-all">
                                <i class="fa fa-chevron-left"></i>
                            </button>
                            <h3 id="currentMonth" class="text-lg font-bold"></h3>
                            <button onclick="changeMonth(1)" class="w-10 h-10 rounded-full bg-gray-100 hover:bg-gray-200 flex items-center justify-center font-bold transition-all">
                                <i class="fa fa-chevron-right"></i>
                            </button>
                        </div>
                    </div>
                    <div class="grid grid-cols-7 gap-2 mb-2">
                        <div class="text-center text-gray-500 font-bold py-2">日</div>
                        <div class="text-center text-gray-500 font-bold py-2">一</div>
                        <div class="text-center text-gray-500 font-bold py-2">二</div>
                        <div class="text-center text-gray-500 font-bold py-2">三</div>
                        <div class="text-center text-gray-500 font-bold py-2">四</div>
                        <div class="text-center text-gray-500 font-bold py-2">五</div>
                        <div class="text-center text-gray-500 font-bold py-2">六</div>
                    </div>
                    <div id="calendarGrid" class="grid grid-cols-7 gap-2"></div>
                    <div class="flex items-center justify-center gap-4 mt-4">
                        <div class="flex items-center gap-2">
                            <div class="w-4 h-4 rounded-lg bg-primary"></div>
                            <span class="text-sm text-gray-600">已打卡</span>
                        </div>
                        <div class="flex items-center gap-2">
                            <div class="w-4 h-4 rounded-lg bg-gray-100 border border-gray-300"></div>
                            <span class="text-sm text-gray-600">未打卡</span>
                        </div>
                        <div class="flex items-center gap-2">
                            <div class="w-4 h-4 rounded-lg bg-primary/20 border-2 border-primary"></div>
                            <span class="text-sm text-gray-600">今天</span>
                        </div>
                    </div>
                </div>

                <!-- 历史记录 -->
                <div class="bg-white rounded-2xl p-6 card-shadow cute-border cute-shadow">
                    <div class="flex items-center justify-between mb-4">
                        <h2 class="text-2xl font-bold flex items-center gap-2">
                            <span class="text-2xl">📝</span> 最近打卡记录
                        </h2>
                        <span class="text-sm text-gray-500" id="recordCount">共0条记录</span>
                    </div>
                    <div id="historyList" class="space-y-3 max-h-96 overflow-y-auto pr-2">
                        <div class="text-center py-10 text-gray-400">
                            <div class="text-5xl mb-2">🤸</div>
                            <p>还没有打卡记录哦，快去运动吧！</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer class="text-center py-6 text-gray-500 text-sm">
        <p>💪 小P健身打卡助手 · 清爽记录每一天 ✨</p>
    </footer>

    <div id="successToast" class="fixed bottom-6 left-1/2 transform -translate-x-1/2 bg-primary text-white px-6 py-3 rounded-xl font-bold shadow-lg z-50 opacity-0 pointer-events-none transition-all duration-300">
        <i class="fa fa-check-circle mr-2"></i> 打卡成功！太棒啦~ 🎉
    </div>

    <script>
        // 数据存储
        let workouts = JSON.parse(localStorage.getItem('fitnessWorkouts')) || [];
        let targets = { weekly: 5, monthly: 20 };
        let currentDate = new Date();

        // 初始化
        document.addEventListener('DOMContentLoaded', () => {
            init();
        });

        function init() {
            renderCalendar();
            updateStats();
            renderHistory();
            document.getElementById('workoutForm').addEventListener('submit', handleSubmit);
        }

        // 提交打卡
        function handleSubmit(e) {
            e.preventDefault();
            
            const type = document.getElementById('workoutType').value;
            const duration = parseInt(document.getElementById('duration').value);
            const calories = parseInt(document.getElementById('calories').value);
            const notes = document.getElementById('notes').value.trim();
            
            if (!duration || !calories) {
                alert('请填写完整信息哦~ 😊');
                return;
            }
            
            const today = new Date();
            const dateStr = today.toISOString().split('T')[0];
            
            // 检查今天是否已经打卡
            const alreadyWorkout = workouts.some(w => w.date === dateStr);
            if (alreadyWorkout) {
                const confirm = window.confirm('今天已经打过卡啦，要更新今天的记录吗？');
                if (!confirm) return;
                workouts = workouts.filter(w => w.date !== dateStr);
            }
            
            // 添加新记录
            const newWorkout = {
                id: Date.now(),
                date: dateStr,
                type,
                duration,
                calories,
                notes,
                timestamp: Date.now()
            };
            
            workouts.unshift(newWorkout);
            localStorage.setItem('fitnessWorkouts', JSON.stringify(workouts));
            
            // 重置表单
            document.getElementById('workoutForm').reset();
            
            // 显示成功提示
            const toast = document.getElementById('successToast');
            toast.style.opacity = '1';
            setTimeout(() => {
                toast.style.opacity = '0';
            }, 2000);
            
            // 更新界面
            renderCalendar();
            updateStats();
            renderHistory();
        }

        // 渲染日历
        function renderCalendar() {
            const year = currentDate.getFullYear();
            const month = currentDate.getMonth();
            
            // 更新月份标题
            const monthNames = ['一月', '二月', '三月', '四月', '五月', '六月', '七月', '八月', '九月', '十月', '十一月', '十二月'];
            document.getElementById('currentMonth').textContent = `${year}年 ${monthNames[month]}`;
            
            const firstDay = new Date(year, month, 1).getDay();
            const daysInMonth = new Date(year, month + 1, 0).getDate();
            const calendarGrid = document.getElementById('calendarGrid');
            calendarGrid.innerHTML = '';
            
            // 填充空白
            for (let i = 0; i < firstDay; i++) {
                const emptyCell = document.createElement('div');
                emptyCell.className = 'calendar-day bg-transparent';
                calendarGrid.appendChild(emptyCell);
            }
            
            // 填充日期
            const today = new Date();
            const todayStr = today.toISOString().split('T')[0];
            
            for (let day = 1; day <= daysInMonth; day++) {
                const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
                const hasWorkout = workouts.some(w => w.date === dateStr);
                const isToday = dateStr === todayStr;
                
                const dayCell = document.createElement('div');
                dayCell.className = `calendar-day ${hasWorkout ? 'workout' : 'bg-gray-100 border border-gray-200'} ${isToday ? 'border-2 border-primary scale-110' : ''}`;
                dayCell.textContent = day;
                
                // 点击查看当天记录
                dayCell.addEventListener('click', () => {
                    const dayWorkouts = workouts.filter(w => w.date === dateStr);
                    if (dayWorkouts.length > 0) {
                        const workout = dayWorkouts[0];
                        alert(`📅 ${dateStr} 打卡记录：
运动类型：${workout.type}
时长：${workout.duration} 分钟
消耗：${workout.calories} 大卡
备注：${workout.notes || '无'}`);
                    }
                });
                
                calendarGrid.appendChild(dayCell);
            }
        }

        // 切换月份
        function changeMonth(delta) {
            currentDate.setMonth(currentDate.getMonth() + delta);
            renderCalendar();
        }

        // 更新统计数据
        function updateStats() {
            // 计算连续打卡天数
            let streak = calculateStreak();
            document.getElementById('streak').textContent = streak;
            
            // 计算本月运动时长
            const thisMonth = new Date().toISOString().slice(0, 7);
            const monthlyWorkouts = workouts.filter(w => w.date.startsWith(thisMonth));
            const monthlyHours = (monthlyWorkouts.reduce((sum, w) => sum + w.duration, 0) / 60).toFixed(1);
            document.getElementById('monthlyHours').textContent = monthlyHours;
            
            // 本周目标进度
            const startOfWeek = new Date();
            startOfWeek.setDate(startOfWeek.getDate() - startOfWeek.getDay());
            const endOfWeek = new Date(startOfWeek);
            endOfWeek.setDate(endOfWeek.getDate() + 6);
            
            const weeklyCount = workouts.filter(w => {
                const workoutDate = new Date(w.date);
                return workoutDate >= startOfWeek && workoutDate <= endOfWeek;
            }).length;
            
            document.getElementById('weeklyTarget').textContent = `${weeklyCount}/${targets.weekly}`;
            
            // 总打卡次数
            document.getElementById('totalWorkouts').textContent = workouts.length;
            document.getElementById('recordCount').textContent = `共${workouts.length}条记录`;
        }

        // 计算连续打卡天数
        function calculateStreak() {
            if (workouts.length === 0) return 0;
            
            let streak = 0;
            const today = new Date();
            let currentDate = new Date(today);
            
            // 按日期排序
            const workoutDates = new Set(workouts.map(w => w.date));
            
            // 检查今天
            const todayStr = today.toISOString().split('T')[0];
            let currentDateStr = todayStr;
            
            // 包括今天如果打卡了的话
            if (workoutDates.has(currentDateStr)) {
                streak++;
            }
            
            // 往前数
            while (true) {
                currentDate.setDate(currentDate.getDate() - 1);
                currentDateStr = currentDate.toISOString().split('T')[0];
                
                if (workoutDates.has(currentDateStr)) {
                    streak++;
                } else {
                    break;
                }
            }
            
            return streak;
        }

        // 渲染历史记录
        function renderHistory() {
            const historyList = document.getElementById('historyList');
            
            if (workouts.length === 0) {
                historyList.innerHTML = `
                    <div class="text-center py-10 text-gray-400">
                        <div class="text-5xl mb-2">🤸</div>
                        <p>还没有打卡记录哦，快去运动吧！</p>
                    </div>
                `;
                return;
            }
            
            historyList.innerHTML = workouts.slice(0, 10).map(workout => `
                <div class="border border-gray-100 rounded-xl p-4 bg-gray-50 hover:bg-gray-100 transition-all">
                    <div class="flex items-center justify-between mb-2">
                        <div class="flex items-center gap-2">
                            <span class="text-xl">${getWorkoutEmoji(workout.type)}</span>
                            <span class="font-bold">${workout.type}</span>
                            <span class="text-xs bg-primary/10 text-primary px-2 py-1 rounded-full">${workout.date}</span>
                        </div>
                        <button onclick="deleteWorkout(${workout.id})" class="text-red-400 hover:text-red-600 transition-all">
                            <i class="fa fa-trash-o"></i>
                        </button>
                    </div>
                    <div class="grid grid-cols-2 gap-2 mb-2 text-sm">
                        <div class="flex items-center gap-1">
                            <span class="text-gray-500">⏱️</span>
                            <span>${workout.duration} 分钟</span>
                        </div>
                        <div class="flex items-center gap-1">
                            <span class="text-gray-500">🔥</span>
                            <span>${workout.calories} 大卡</span>
                        </div>
                    </div>
                    ${workout.notes ? `<p class="text-sm text-gray-600 italic">💬 ${workout.notes}</p>` : ''}
                </div>
            `).join('');
        }

        // 获取运动表情
        function getWorkoutEmoji(type) {
            const emojis = {
                '跑步': '🏃',
                '力量训练': '🏋️',
                '游泳': '🏊',
                '骑行': '🚴',
                '瑜伽': '🧘',
                '徒步': '🥾',
                '跳绳': '🪀',
                '舞蹈': '💃',
                '球类运动': '🏀',
                '其他': '✨'
            };
            return emojis[type] || '✨';
        }

        // 删除打卡记录
        function deleteWorkout(id) {
            if (confirm('确定要删除这条打卡记录吗？')) {
                workouts = workouts.filter(w => w.id !== id);
                localStorage.setItem('fitnessWorkouts', JSON.stringify(workouts));
                renderCalendar();
                updateStats();
                renderHistory();
            }
        }
    </script>
</body>
</html>
